
name: Collect Bear Blog Ranking Data

on:
  schedule:
    # 9:17 AM and 9:17 PM Mountain Standard Time (UTC-7)
    - cron: "17 4,16 * * *"

  # Allows manual testing from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Run collector
        run: python collector.py

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking_observations.csv
          git diff --cached --quiet || git commit -m "Add Bear Blog ranking snapshot"
          git push
